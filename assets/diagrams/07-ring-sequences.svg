<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="118" width="760" height="100" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="52" y="138" font-size="12" font-weight="700" fill="#1d1d1d">Ring of 8 slots (illustration)</text>
<rect x="60" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="100.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 0</text>
<text x="100.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 8</text>
<rect x="150" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="190.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 1</text>
<text x="190.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 9</text>
<rect x="240" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 2</text>
<text x="280.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 10</text>
<rect x="330" y="150" width="80" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="370.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 3</text>
<text x="370.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">next: 11</text>
<rect x="420" y="150" width="80" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="460.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 4</text>
<text x="460.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 4 done</text>
<rect x="510" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="550.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 5</text>
<text x="550.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 5</text>
<rect x="600" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="640.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 6</text>
<text x="640.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 6</text>
<rect x="690" y="150" width="80" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="730.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 7</text>
<text x="730.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">seq 7</text>
<rect x="280" y="56" width="180" height="54" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="370.0" y="81.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Producer</text>
<text x="370.0" y="98.0" font-size="11.5" fill="#555555" text-anchor="middle">cursor: own cache line</text>
<rect x="460" y="250" width="180" height="54" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="550.0" y="275.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer</text>
<text x="550.0" y="292.0" font-size="11.5" fill="#555555" text-anchor="middle">cursor: own cache line</text>
<rect x="40" y="250" width="380" height="54" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="230.0" y="275.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot = sequence &amp; (slots - 1)</text>
<text x="230.0" y="292.0" font-size="11.5" fill="#555555" text-anchor="middle">slots is a power of two: 65,536 in the run</text>
<rect x="680" y="250" width="170" height="54" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="765.0" y="275.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Full ring</text>
<text x="765.0" y="292.0" font-size="11.5" fill="#555555" text-anchor="middle">the producer would wait</text>
<path d="M370,110 L370,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="424.0" y="130.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">publish seq 11</text>
<text x="424.0" y="130.0" font-size="11" fill="#b8650a" text-anchor="middle">publish seq 11</text>
<path d="M550,200 L550,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="590.0" y="225.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">read seq 5</text>
<text x="590.0" y="225.0" font-size="11" fill="#555" text-anchor="middle">read seq 5</text>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A sequence only grows; masking turns it into a slot</text>
<text x="440" y="340" font-size="12" fill="#1d1d1d" text-anchor="middle">Producer and consumer each write one cursor and read the other, so neither takes a lock.</text>
</svg>