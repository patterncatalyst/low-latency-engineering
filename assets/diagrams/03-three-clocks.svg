<rect x="55" y="60" width="130" height="56" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="120.0" y="86.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Intended emit</text>
