<path d="M625,88 L715,88" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="670.0" y="80.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">work</text>
