<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="840" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">Fetch-add log (slot numbers illustrate the 1,000,000-slot log)</text>
<rect x="200" y="74" width="140" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="270.0" y="97.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Producer</text>
<text x="270.0" y="114.0" font-size="11.5" fill="#555555" text-anchor="middle">sleeps 1 ms</text>
<rect x="40" y="176" width="140" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="110.0" y="199.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 41</text>
<text x="110.0" y="216.0" font-size="11.5" fill="#555555" text-anchor="middle">published, read</text>
<rect x="200" y="176" width="140" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="270.0" y="199.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 42</text>
<text x="270.0" y="216.0" font-size="11.5" fill="#555555" text-anchor="middle">claimed, unpublished</text>
<rect x="360" y="176" width="140" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="430.0" y="199.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 43</text>
<text x="430.0" y="216.0" font-size="11.5" fill="#555555" text-anchor="middle">published, waiting</text>
<rect x="520" y="176" width="140" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="590.0" y="199.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">slot 44</text>
<text x="590.0" y="216.0" font-size="11.5" fill="#555555" text-anchor="middle">published, waiting</text>
<rect x="200" y="284" width="140" height="56" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="270.0" y="310.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer</text>
<text x="270.0" y="327.0" font-size="11.5" fill="#555555" text-anchor="middle">stopped at slot 42</text>
<rect x="520" y="284" width="320" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="680.0" y="310.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer wait at the stalled slot</text>
<text x="680.0" y="327.0" font-size="11.5" fill="#555555" text-anchor="middle">C++ 1.05-1.07 ms, Java 1.11-1.14 ms</text>
<path d="M270,124 L270,176" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="332.0" y="152.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">claim, then sleep</text>
<text x="332.0" y="152.0" font-size="11" fill="#555" text-anchor="middle">claim, then sleep</text>
<path d="M270,284 L270,226" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="300.0" y="255.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">waits</text>
<text x="300.0" y="255.0" font-size="11" fill="#b8650a" text-anchor="middle">waits</text>
<path d="M340,312 L520,312" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A wait-free claim does not make the consumer wait-free</text>
<text x="440" y="364" font-size="12" fill="#1d1d1d" text-anchor="middle">The claim is wait-free; the consumer waits for the slowest producer.</text>
</svg>