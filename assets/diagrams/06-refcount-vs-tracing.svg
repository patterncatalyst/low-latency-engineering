<path d="M600,220 L660,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,266 L280,266" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,266 L660,266" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M220,346 L280,346" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,346 L660,346" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,392 L280,392" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M600,392 L660,392" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">Where reclaim cost lands depends on the runtime and on who frees</text>
<text x="440" y="436" font-size="12" fill="#1d1d1d" text-anchor="middle">Amber: the variant that keeps reclaim off the latency-critical path.</text>
