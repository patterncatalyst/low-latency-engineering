<text x="760.0" y="164.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">max GC pause</text>
<text x="760.0" y="181.0" font-size="11.5" fill="#555555" text-anchor="middle">21.4-22.0 ms</text>
