<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">Same bytecode, same allocation: the collector sets the pause</text>
<text x="440" y="388" font-size="12" fill="#1d1d1d" text-anchor="middle">The pause is half of the tail; the other half is whether the collector keeps up (Figure 6.2).</text>
