<text x="125.0" y="221.0" font-size="11.5" fill="#555555" text-anchor="middle">4 GB heap, pre-touched</text>
<text x="125.0" y="236.0" font-size="11.5" fill="#555555" text-anchor="middle">JFR pause events</text>
