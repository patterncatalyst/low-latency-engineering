<text x="440.0" y="84.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stop-the-world</text>
<text x="440.0" y="101.0" font-size="11.5" fill="#555555" text-anchor="middle">all threads stop, full walk</text>
