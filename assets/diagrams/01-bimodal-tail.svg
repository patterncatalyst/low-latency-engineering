<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 385" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="840" height="120" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">One core, per-parcel handling</text>
<rect x="60" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="88.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#98</text>
<rect x="126" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="154.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#99</text>
<rect x="196" y="96" width="220" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="306.0" y="119.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#100 slow path ~2 ms</text>
<text x="306.0" y="136.0" font-size="11.5" fill="#555555" text-anchor="middle">busy loop, holds the core</text>
<rect x="426" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="454.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#101</text>
<rect x="492" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="520.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#102</text>
<rect x="558" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="586.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#103</text>
<rect x="624" y="96" width="56" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="652.0" y="126.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#104</text>
<rect x="40" y="250" width="230" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fast mode</text>
<text x="155.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">p50 89-186 us</text>
<rect x="400" y="250" width="240" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="520.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Slow mode</text>
<text x="520.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">p99 2.9-6.0 ms</text>
<text x="520.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">#100 and the parcels behind it</text>
<rect x="670" y="250" width="190" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="765.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one summary number</text>
<text x="765.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">describes neither group</text>
<path d="M154,146 L154,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="170.0" y="198.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">p50</text>
<text x="170.0" y="198.0" font-size="11" fill="#555" text-anchor="middle">p50</text>
<path d="M454,146 L454,250" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="470.0" y="198.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">p99</text>
<text x="470.0" y="198.0" font-size="11" fill="#b8650a" text-anchor="middle">p99</text>
<path d="M306,146 L420,250" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">p50 stays in the fast mode; p99 lands in the millisecond slow mode</text>
<text x="489" y="88" font-size="11" fill="#1d1d1d" text-anchor="middle">queued behind it</text>
<text x="440" y="365" font-size="12" fill="#1d1d1d" text-anchor="middle">1 parcel in 100 takes the slow path and delays the next few; the median never sees it.</text>
</svg>