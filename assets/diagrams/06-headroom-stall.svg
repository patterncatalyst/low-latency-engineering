<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="840" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">Right-sized: -Xms4g -Xmx4g, a live set well under the heap</text>
<rect x="20" y="190" width="840" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="210" font-size="12" font-weight="700" fill="#1d1d1d">Undersized: heap = 1.05x the live set, same allocation rate</text>
<rect x="40" y="90" width="150" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Handler</text>
<text x="115.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">~400 MB/s of garbage</text>
<rect x="230" y="90" width="190" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="325.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ZGC cycles</text>
<text x="325.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">ahead of the rate</text>
<rect x="460" y="90" width="190" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="555.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">0 allocation stalls</text>
<text x="555.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">p99.9 0.147-0.149 ms</text>
<rect x="40" y="236" width="150" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="264.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Handler</text>
<text x="115.0" y="281.0" font-size="11.5" fill="#555555" text-anchor="middle">~400 MB/s of garbage</text>
<rect x="230" y="236" width="190" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="325.0" y="264.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ZGC cycles</text>
<text x="325.0" y="281.0" font-size="11.5" fill="#555555" text-anchor="middle">free memory runs out</text>
<rect x="460" y="236" width="180" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="550.0" y="264.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">allocation stall</text>
<text x="550.0" y="281.0" font-size="11.5" fill="#555555" text-anchor="middle">the thread waits</text>
<rect x="680" y="236" width="170" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="765.0" y="264.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">530-977 stalls</text>
<text x="765.0" y="281.0" font-size="11.5" fill="#555555" text-anchor="middle">p99.9 50.4-113.0 ms</text>
<path d="M190,120 L230,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,120 L460,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M190,266 L230,266" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,266 L460,266" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M640,266 L680,266" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A concurrent collector is only as good as its headroom</text>
<text x="440" y="348" font-size="12" fill="#1d1d1d" text-anchor="middle">A stall is a pause by another name: the allocating thread waits for the collector.</text>
</svg>