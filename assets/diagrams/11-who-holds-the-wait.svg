<text x="125.0" y="238.5" font-size="11.5" fill="#555555" text-anchor="middle">C++ Boost.Fiber,</text>
<text x="125.0" y="253.5" font-size="11.5" fill="#555555" text-anchor="middle">Java virtual thread</text>
<rect x="260" y="194" width="240" height="74" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
