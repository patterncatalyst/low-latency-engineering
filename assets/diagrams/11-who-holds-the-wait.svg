<text x="380.0" y="373.5" font-size="11.5" fill="#555555" text-anchor="middle">Python: 1,641 B (tracemalloc)</text>
<rect x="550" y="314" width="300" height="74" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="700.0" y="341.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Per wait: user RSS, address space (B)</text>
<text x="700.0" y="358.5" font-size="11.5" fill="#555555" text-anchor="middle">C++ 1,009, not per task*</text>
