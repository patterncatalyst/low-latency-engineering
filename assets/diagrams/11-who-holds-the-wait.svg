<rect x="20" y="44" width="840" height="112" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">OS threads: every wait owns a kernel stack and a reserved user stack</text>
