<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A parked wait costs a stack, a small stack or only a frame</text>
<text x="440" y="420" font-size="12" fill="#1d1d1d" text-anchor="middle">10,000 tasks parked on one 1,000 ms timer; bytes per task, range across three runs.</text>
<text x="440" y="438" font-size="12" fill="#1d1d1d" text-anchor="middle">* address space grew in steps (Java carrier arenas) or not at all (C++ frames in already-mapped heap)</text>
