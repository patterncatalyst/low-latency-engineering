<text x="125.0" y="101.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OS thread</text>
<text x="125.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">C++, Python and Java</text>
<text x="125.0" y="133.5" font-size="11.5" fill="#555555" text-anchor="middle">threads</text>
