<text x="277.0" y="222.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">kernel crossing</text>
<text x="277.0" y="222.0" font-size="11" fill="#b8650a" text-anchor="middle">kernel crossing</text>
<path d="M225,284 L225,312" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M672,109 L652,109" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M559,140 L559,164" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M655,214 L655,240" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="701.0" y="229.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">io_uring_enter</text>
<text x="701.0" y="229.0" font-size="11" fill="#b8650a" text-anchor="middle">io_uring_enter</text>
<path d="M655,290 L655,312" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">One io_uring_enter reaps 14.7-16.2 completions; epoll pays a recvmsg per parcel plus epoll_wait</text>
<text x="440" y="408" font-size="12" fill="#1d1d1d" text-anchor="middle">60 kHz x 4 cameras for 3 s: per-run median of 3 alternations, range across 3 runs; the counts depend on load.</text>
</svg>