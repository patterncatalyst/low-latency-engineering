<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="410" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">Readiness: epoll_wait, then recvmsg</text>
<rect x="450" y="44" width="410" height="340" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="462" y="64" font-size="12" font-weight="700" fill="#1d1d1d">Completion: io_uring with a multishot recvmsg</text>
<rect x="100" y="78" width="250" height="50" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="225.0" y="101.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">UDP socket queue</text>
<text x="225.0" y="118.0" font-size="11.5" fill="#555555" text-anchor="middle">datagrams wait here</text>
<rect x="100" y="156" width="250" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="225.0" y="179.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">epoll_wait</text>
<text x="225.0" y="196.0" font-size="11.5" fill="#555555" text-anchor="middle">returns: the socket is ready</text>
<rect x="100" y="234" width="250" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="225.0" y="257.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">recvmsg</text>
<text x="225.0" y="274.0" font-size="11.5" fill="#555555" text-anchor="middle">takes one datagram</text>
<rect x="40" y="312" width="370" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="225.0" y="333.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">System calls per parcel (C++, saturation)</text>
<text x="225.0" y="350.5" font-size="11.5" fill="#555555" text-anchor="middle">epoll 1.379-1.417: recvmsg 1, epoll_wait 0.379-0.417</text>
<text x="225.0" y="365.5" font-size="11.5" fill="#555555" text-anchor="middle">recvmmsg 0.573-0.614</text>
<rect x="466" y="78" width="186" height="62" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="559.0" y="99.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Multishot recvmsg</text>
<text x="559.0" y="116.5" font-size="11.5" fill="#555555" text-anchor="middle">stays armed; re-armed</text>
<text x="559.0" y="131.5" font-size="11.5" fill="#555555" text-anchor="middle">when the kernel ends it</text>
<rect x="672" y="78" width="158" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="751.0" y="107.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Provided buffer ring</text>
<text x="751.0" y="124.0" font-size="11.5" fill="#555555" text-anchor="middle">kernel picks a buffer</text>
<rect x="500" y="164" width="310" height="50" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="655.0" y="187.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Completion queue</text>
<text x="655.0" y="204.0" font-size="11.5" fill="#555555" text-anchor="middle">one entry per datagram</text>
<rect x="500" y="240" width="310" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="655.0" y="263.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Reap every queued entry</text>
<text x="655.0" y="280.0" font-size="11.5" fill="#555555" text-anchor="middle">io_uring_enter only to wait</text>
<rect x="470" y="312" width="370" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="655.0" y="333.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">System calls per parcel (C++, saturation)</text>
<text x="655.0" y="350.5" font-size="11.5" fill="#555555" text-anchor="middle">io_uring_enter 0.062-0.068</text>
<text x="655.0" y="365.5" font-size="11.5" fill="#555555" text-anchor="middle">14.7-16.2 completions per io_uring_enter</text>
