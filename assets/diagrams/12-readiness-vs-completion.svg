<text x="277.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">kernel crossing</text>
<text x="277.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">kernel crossing</text>
