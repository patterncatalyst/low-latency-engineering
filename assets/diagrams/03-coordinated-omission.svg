<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="44" width="840" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="64" font-size="12" font-weight="700" fill="#1d1d1d">UDP run: ~200 parcels queue behind the stall</text>
<rect x="20" y="226" width="840" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="246" font-size="12" font-weight="700" fill="#1d1d1d">Closed-loop client: 1 request per 1 ms, same stall</text>
<rect x="40" y="106" width="150" height="56" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="132.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consumer</text>
<text x="115.0" y="149.0" font-size="11.5" fill="#555555" text-anchor="middle">stalls 200 ms</text>
<rect x="290" y="72" width="250" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="415.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">receipt-time</text>
<text x="415.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">clock starts at dequeue</text>
<rect x="290" y="140" width="250" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="415.0" y="166.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">intended-time</text>
<text x="415.0" y="183.0" font-size="11.5" fill="#555555" text-anchor="middle">clock starts at belt schedule</text>
<rect x="630" y="72" width="220" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="98.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99 5.1-5.4 us</text>
<text x="740.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">C++: stall hidden</text>
<rect x="630" y="140" width="220" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="166.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99 100.3-100.5 ms</text>
<text x="740.0" y="183.0" font-size="11.5" fill="#555555" text-anchor="middle">C++; Java 100.8-101.5 ms</text>
<rect x="40" y="288" width="150" height="56" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="314.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client</text>
<text x="115.0" y="331.0" font-size="11.5" fill="#555555" text-anchor="middle">waits for each reply</text>
<rect x="290" y="254" width="250" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="415.0" y="280.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">closed-loop naive</text>
<text x="415.0" y="297.0" font-size="11.5" fill="#555555" text-anchor="middle">1 slow sample in 10,000</text>
<rect x="290" y="322" width="250" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="415.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">closed-loop corrected</text>
<text x="415.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">back-fills ~199 missed</text>
<rect x="630" y="254" width="220" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="280.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99 1.0 us</text>
<text x="740.0" y="297.0" font-size="11.5" fill="#555555" text-anchor="middle">C++; Java 6.9-7.0 us</text>
<rect x="630" y="322" width="220" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99 98.2 ms</text>
<text x="740.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">C++; Java 99.1-99.3 ms</text>
<path d="M190,120 L290,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M190,148 L290,168" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M540,100 L630,100" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M540,168 L630,168" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M190,302 L290,282" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M190,330 L290,350" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<path d="M540,282 L630,282" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M540,350 L630,350" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A 200 ms stall: only the schedule clock and the back-fill see it</text>
<text x="440" y="420" font-size="12" fill="#1d1d1d" text-anchor="middle">Dashed: samples the stalled client never took, added back by the correction.</text>
</svg>