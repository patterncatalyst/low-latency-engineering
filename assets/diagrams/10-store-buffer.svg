<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">A store can sit in a buffer while the other station reads the old value</text>
<text x="440" y="384" font-size="12" fill="#1d1d1d" text-anchor="middle">seq_cst (an xchg store, 4 ns against 0 ns for release) forbids the both-zero outcome; release/acquire allows it.</text>
