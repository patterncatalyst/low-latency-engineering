<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">Lookup cost follows the working set: L2 holds the line tracker, RAM holds the hub</text>
<text x="440" y="424" font-size="12" fill="#1d1d1d" text-anchor="middle">The 4,800-parcel line tracker fits L2 in both maps; at 1,000,000 parcels both maps live in RAM and the layout sets the misses.</text>
