<text x="140.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">--cpu 3, guest CPUs 0-2</text>
<rect x="250" y="100" width="170" height="60" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="335.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">vCPU 0-2</text>
<text x="335.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">free over host CPUs 0-15</text>
<rect x="250" y="200" width="170" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="335.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Decide thread</text>
<text x="335.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">unpinned, CPUs 0-3</text>
<rect x="490" y="100" width="170" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="575.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Decide thread</text>
<text x="575.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">pinned: AffinityLock(3)</text>
<rect x="490" y="200" width="170" height="60" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="575.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">vCPU 3 (isolated)</text>
<text x="575.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">kernel keeps tasks off it</text>
<rect x="720" y="200" width="130" height="60" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="785.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">host CPU 13</text>
<text x="785.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">a pin, not isolation</text>
<rect x="235" y="306" width="200" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="335.0" y="326.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">VM: unpinned</text>
<text x="335.0" y="343.5" font-size="11.5" fill="#555555" text-anchor="middle">involuntary 174,388-313,298</text>
<text x="335.0" y="358.5" font-size="11.5" fill="#555555" text-anchor="middle">hand-off p99.9 1.09-1.86 ms</text>
<rect x="475" y="306" width="200" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="575.0" y="326.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">VM: pinned</text>
<text x="575.0" y="343.5" font-size="11.5" fill="#555555" text-anchor="middle">involuntary 0-5</text>
<text x="575.0" y="358.5" font-size="11.5" fill="#555555" text-anchor="middle">hand-off p99.9 51-55 us</text>
