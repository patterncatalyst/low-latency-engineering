<text x="690.0" y="222.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">vcpupin</text>
<text x="690.0" y="222.0" font-size="11" fill="#b8650a" text-anchor="middle">vcpupin</text>
<path d="M335,260 L335,306" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M575,260 L575,306" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="440" y="28" font-size="14" fill="#b8650a" text-anchor="middle" font-weight="700">Pinning to an isolated vCPU keeps stress-ng off the decide thread</text>
<text x="440" y="400" font-size="12" fill="#1d1d1d" text-anchor="middle">VM figures, never compared with host runs. Pinned and unpinned alternate three times in one boot.</text>
</svg>