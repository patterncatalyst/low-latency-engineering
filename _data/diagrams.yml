- name: "00-sortation-line"
  section: "Ch0 · Setup"
  title: "The sortation line and the scan-to-divert budget"
  alt: "A conveyor carries parcels past a checkweigher, dimensioner, scanner and labeler to a diverter; the controller must sense, decide and act within the scan-to-divert deadline."
  caption: "Figure 0.1: The sortation line. Belt speed and the scanner-to-diverter distance set the decision deadline."

- name: "00-lab-topology"
  section: "Ch0 · Setup"
  title: "The VM lab: an unprivileged host and a PREEMPT_RT guest"
  alt: "A host band holding lab-ssh.sh, libvirt-ssh-proxy, passt and Docker Engine, with a guest band inside it holding cyclictest, linuxptp, the PREEMPT_RT kernel, Docker and the snapshots lab-ready and lab-ready-rt; an amber ssh-over-AF_VSOCK path runs from the proxy to the guest, and guest traffic leaves through passt."
  caption: "Figure 0.2: The lab guest is reached by ssh over vsock and networked by passt, so the host needs no NAT, bridge or firewall change. VM numbers are never compared with bare-metal numbers."

- name: "00-measurement-pipeline"
  section: "Ch0 · Setup"
  title: "From the line simulator to a checked report"
  alt: "The C++ line simulator sends UDP datagrams on 127.0.0.1 at 1 kHz to the C++, Python and Java consumers in turn; each records into HdrHistogram and writes a lowlat-report/1 JSON report carrying the machine profile from profile.sh; lowlat-report check validates the schema, decodes the histogram and recomputes the percentiles."
  caption: "Figure 0.3: Every language records into HdrHistogram and writes the same report format, and the checker recomputes the percentiles instead of trusting them."

- name: "01-batch-vs-per-parcel"
  section: "Ch1 · Latency vs bandwidth"
  title: "Per-parcel handling against batch-32"
  alt: "Two lanes of parcels arriving at 1 kHz: the per-parcel lane handles each parcel on arrival, with p50 85-188 us; the batch lane gathers parcels 1 to 32 into one handling step, and an amber arrow marks the first parcel's ~31 ms wait, with p50 15.2-15.4 ms."
  caption: "Figure 1.1: Batching leaves throughput unchanged but moves the p50 from 85-188 us to 15.2-15.4 ms, because the first parcel waits for 31 others."

- name: "01-bimodal-tail"
  section: "Ch1 · Latency vs bandwidth"
  title: "One slow parcel in a hundred"
  alt: "Parcels 98 to 104 in a row, with parcel 100 drawn wide as an amber ~2 ms slow path that holds the core and parcel 101 queued behind it; p50 points to a fast-mode box (p50 95-232 us) and p99 to a slow-mode box (p99 2.1-6.8 ms), and a ghost box says one summary number describes neither group."
  caption: "Figure 1.2: The median stays in the fast mode while p99 lands in the slow mode, among the slow parcel and those queued behind it. One summary number describes neither group."

- name: "02-littles-law"
  section: "Ch2 · Little's Law and Amdahl's Law"
  title: "Little's Law on the line"
  alt: "The line simulator feeds a consumer band at 1000 parcels/s; the band holds a queue of L parcels and a handler with a variable service time; a sampler counts L and a W-bar box labelled model input takes each parcel's residence time; a result box compares sampled L with lambda x W-bar: C++ +0.3 to +0.5 %, Java +1.3 to +4.3 %."
  caption: "Figure 2.1: The consumer as a queue. Sampled L matches lambda x W-bar within 0.5 % in C++ and 4.3 % in Java; W-bar is a model input, never a reported latency."

- name: "02-amdahl-phases"
  section: "Ch2 · Little's Law and Amdahl's Law"
  title: "Amdahl's Law in phases at N = 1, 2 and 4"
  alt: "Three lanes for N = 1, 2 and 4 workers: parallel scan bars shrink as workers are added, a barrier follows, then an amber serial phase of the same width in every lane and a second barrier; a result box lists predicted and measured speedups at N = 4 for C++, Python threads, Python processes and Java."
  caption: "Figure 2.2: The serial phase does not shrink with N, so the measured speedup at N = 4 (C++ 2.83-2.85x, Java 2.74-2.75x) stays under the Amdahl prediction of about 3.1x; Python threads under the GIL fall below 1x."

- name: "03-three-clocks"
  section: "Ch3 · Measuring correctly"
  title: "Where each clock starts"
  alt: "A timeline of intended emit, actual send, dequeue and done, with three bars below ending at done: intended-time (amber) starts at the belt's schedule, closed-loop at the send of its own request, receipt-time at dequeue."
  caption: "Figure 3.1: Three clocks on one parcel. Only intended-time starts at the belt's schedule, so only it is charged for the wait."

- name: "03-coordinated-omission"
  section: "Ch3 · Measuring correctly"
  title: "A 200 ms stall, seen four ways"
  alt: "Two bands: in the UDP run a stalled consumer feeds receipt-time (C++ p99 5.4-11.9 us) and intended-time (p99 100.4-100.5 ms C++, 101.4-101.7 ms Java); in the closed-loop run a client feeds naive (p99 1.0-1.1 us C++, 6.9-7.1 us Java) and, through a dashed back-fill edge, corrected (p99 98.2 ms C++, 99.2-99.3 ms Java)."
  caption: "Figure 3.2: A 200 ms stall is invisible to receipt-time and to the naive closed loop, and visible to the schedule clock and to the back-filled correction. Numbers: bare-metal, untuned host (an 8-core, 16-thread Intel laptop CPU, Fedora 44 kernel 7.2, governor `powersave`), runs r02-run1..3."

- name: "04-three-harnesses"
  section: "Ch4 · Benchmark harnesses"
  title: "One workload, three harnesses"
  alt: "A check-digit workload fans out to three lanes: Google Benchmark (C++, DoNotOptimize, 30 repetitions) to median and p99, where p99 is the slowest repetition, pyperf (Python, 6 processes, 3 warm-ups each) to median and p99 of 24 values, and JMH SampleTime (Java, 3 forks, warm-up, Blackhole) to p50, p99 and p99.9."
  caption: "Figure 4.1: The same check-digit workload in three harnesses. Each repeats and warms up, and each is read as percentiles rather than a single number."

- name: "04-dead-code-elimination"
  section: "Ch4 · Benchmark harnesses"
  title: "Dead-code elimination"
  alt: "C++ and Java lanes each show a guarded variant (DoNotOptimize, Blackhole.consume) with a measured median (4.73 to 4.74 ns in C++, p50 31 to 32 ns in Java) and an eliminated variant whose result is unused and removed, timing about 0 ns, at least 472x lower in C++ and at least 3,100x lower in Java; the Python lane is a ghost box: CPython does not eliminate the work, and the contrast there is warm-up."
  caption: "Figure 4.2: When the result is unused, the compiler or JIT removes the work and the benchmark times nothing."

- name: "05-jit-tiers"
  section: "Ch5 · What the JVM costs"
  title: "JIT tiers and who pays for warm-up"
  alt: "A chain from the interpreter (tier 0) to C1 (tier 1, with tiers 2 and 3 adding profiling) to C2 (tier 4, optimized code), with a dashed deoptimization path from C2 back to the interpreter when an assumption breaks. Below, three line runs at 1 kHz for 20 s compare the first window of 2,000 parcels: --unwarmed binds at once and has a first-window p99.9 of 14.4-27.7 ms; warmed replays 20,000 parcels before the bind (0.27-0.52 ms), and an amber arrow shows the replay driving the code to C2; aot-cache starts from a cache of classes and profiles with no compiled code (0.75-1.6 ms). A note gives the time to ready, a median of 5 launches: 177-178 ms without a trained AOT cache and 50-51 ms with one."
  caption: "Figure 5.1: The first parcels pay for class loading, interpretation and compilation. Replaying parcels before the bind moves that cost off the belt; the AOT cache (classes and profiles, no compiled code) shortens warm-up but does not remove it."

- name: "05-escape-analysis"
  section: "Ch5 · What the JVM costs"
  title: "Escape analysis removes the allocation"
  alt: "Three JMH lanes run the same decide() call on each parcel. In the escaping lane the DivertDecision is stored in a field, so it stays on the heap and gc.alloc.rate.norm is about 24 B/op. In the scalar-replaced lane (amber) C2 keeps the fields in registers and the counter is below 1 B/op. In the --no-escape-analysis lane, scalar replacement is absent and the counter is about 24 B/op again."
  caption: "Figure 5.2: An object that never leaves the compiled method costs nothing on the heap: about 24 B/op becomes less than 1 B/op, and turning escape analysis off brings the 24 B back."

- name: "06-collector-pauses"
  section: "Ch6 · GC for tails"
  title: "What each collector stops"
  alt: "A tracker at 10 kHz for 30 s with a 4 GB pre-touched heap feeds four collectors, each with the maximum GC pause read from JFR: stop-the-world Parallel, where all threads stop and the heap is walked, 158-162 ms; G1 with stop-the-world evacuation, 21.4-22.0 ms; Generational ZGC (amber) with concurrent mark and relocate, 0.020-0.039 ms; and generational Shenandoah with concurrent evacuation, 0.61-0.81 ms."
  caption: "Figure 6.1: Same bytecode and allocation, different collector: the maximum pause runs from 158-162 ms under Parallel to 0.020-0.039 ms under ZGC."

- name: "06-headroom-stall"
  section: "Ch6 · GC for tails"
  title: "Headroom decides whether allocation stalls"
  alt: "Two lanes with the same handler allocating about 400 MB/s of garbage. With a 4 GB heap and a live set well under it, ZGC cycles stay ahead of the rate: 0 allocation stalls and p99.9 of 0.147-0.149 ms. With the heap at 1.05 times the live set, free memory runs out and an amber path leads to an allocation stall where the thread waits; the run records 530-977 stalls with p99.9 of 50.4-113.0 ms."
  caption: "Figure 6.2: A concurrent collector needs headroom. At 1.05 times the live set, ZGC stalls the allocating thread 530-977 times and p99.9 rises from 0.147-0.149 ms to 50.4-113.0 ms."

- name: "06-refcount-vs-tracing"
  section: "Ch6 · GC for tails"
  title: "Who reclaims memory in C++, Python and Java"
  alt: "Three lanes in the order C++, Python, Java, each with its end-to-end p99.9 latency. C++: the owner frees, so bulk-free destroys a wave on the hot thread (2.13-2.31 ms) while deferred-free hands it to a reclaimer thread (0.139-0.145 ms). Python: refcounts free at once and a generational cycle collector finds cycles; cyclic-garbage runs 9 gen-2 collections (138-141 ms) and frozen, with no cycles and gc.freeze(), runs 0 (0.166-0.170 ms). Java: tracing collectors mark what is live; stop-the-world Parallel is 153-154 ms and ZGC 0.147-0.149 ms."
  caption: "Figure 6.3: C++ frees where the owner says, CPython frees by reference count and sweeps cycles in generations, and the JVM traces from roots; each has a variant that keeps the reclaim cost off the latency-critical path."

- name: "07-handoff-topology"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "The hand-off between the receive and decide threads"
  alt: "A receive thread passes parcels through a hand-off of 65,536 slots (amber) to the decide thread, which sends divert commands on a separate command channel. A dashed path to an audit journal marks that only the chronicle-journal and write-per-parcel variants append to it. Three hand-off variants can be swapped in (dashed): blocking-queue, an ArrayBlockingQueue that parks, with 199,383-199,582 voluntary context switches over 200,000 parcels; agrona-spsc, whose idle strategy busy-spins, with 38-47; and disruptor with BusySpinWaitStrategy, with 23-31."
  caption: "Figure 7.1: A spinning idle strategy keeps the decide thread running: 38-47 voluntary context switches for Agrona and 23-31 for the Disruptor, against almost one per parcel for a blocking queue."

- name: "07-ring-sequences"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "Sequences and slots in a ring buffer"
  alt: "A ring of eight slots, drawn as an illustration of the 65,536-slot ring, holds sequences 5 to 10 in slots 5, 6, 7, 0, 1 and 2. The producer, with its cursor on its own cache line, publishes sequence 11 into slot 3 (amber arrow); the consumer reads sequence 5 from slot 5. The slot is the sequence masked with slots minus one, which works because the slot count is a power of two. A dashed ghost box marks a full ring, where the producer would have to wait."
  caption: "Figure 7.2: A sequence only grows; masking maps it to a slot, and each side writes only its own cursor, so neither takes a lock."

- name: "07-affinity-vm"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "Pinning the decide thread to an isolated vCPU (VM)"
  alt: "Inside the host, the guest lowlat-target boots with isolcpus=3 nohz_full=3 rcu_nocbs=3. stress-ng runs on guest CPUs 0-2, which are vCPUs 0-2, unpinned on the host. An unpinned decide thread shares them and records 119,779-360,310 involuntary context switches across nine alternations and a steady-window hand-off p99.9 of 0.43-1.56 ms (median of 3 alternations per run). A pinned decide thread (AffinityLock 3, amber) runs on the isolated vCPU 3, which libvirt pins to host CPU 13, and records 0-5 involuntary switches and a p99.9 of 54-55 us (same median). All figures are from the VM."
  caption: "Figure 7.3: Pinned to an isolated vCPU, the decide thread is no longer preempted by the stress load. These are VM figures, never compared with the host runs."

- name: "08-zero-copy-decode"
  section: "Ch8 · Zero-copy and flat data"
  title: "Protobuf parse against a flat view"
  alt: "One receive buffer, a user-space direct ByteBuffer holding one datagram at a time, feeds two decoders. protobuf-decode calls parseFrom and builds a ParcelEvent, a Dimensions and a String barcode: 576 B/op with a p50 of 157-162 ns in JMH and 591 B per parcel on the line. flat-ffm (amber) puts a reused FlatView on the same bytes, a MemorySegment with VarHandles over the 80-byte parcel-v1 record that checks schema, version and size first: less than 1 B/op, p50 16 ns, and 8.76 B per parcel on the line."
  caption: "Figure 8.1: A flat 80-byte record read in place allocates under 1 B per decode, against 576 B for a protobuf parse."

- name: "08-flat-vs-pointer-layout"
  section: "Ch8 · Zero-copy and flat data"
  title: "An array of objects against a flat table"
  alt: "An object-table of 1,000,000 references points at ParcelState objects scattered on the heap, each with a header and fields, and a sweep of the table takes a p50 of 4.97-5.03 ms. A flat-table keeps 24-byte slots side by side in one MemorySegment in an Arena, and the same sweep takes 0.95-0.97 ms. A dashed ghost box, ParcelState as a value class (JEP 401, JDK 28 early access only), points at the object-table to show the flat layout it aims at on the heap; on common hardware JEP 401 flattens a mutable field or array element only up to 64 bits, null flag included, so a 22-byte ParcelState needs later enhancements. It is not measured, and the book pins JDK 25 LTS."
  caption: "Figure 8.2: Sweeping one run of memory takes 0.95-0.97 ms, against 4.97-5.03 ms for a pointer per parcel. Value classes aim at that layout but are early access only, so the book measures the flat table."

- name: "09-working-set"
  section: "Ch9 · Eliminating work"
  title: "The working set against the cache hierarchy"
  alt: "Nested bands show the host caches: L3 of 24 MiB, L2 of 1.25 MiB and L1d of 48 KiB with 64-byte lines. Inside L2 sits the line tracker with 4,800 parcels, where a node-map lookup takes a p50 of 46-48 ns and a flat-map lookup (amber) 20 ns. A separate RAM band holds the hub trackers of 1,000,000 parcels: the node-map, 148.1 MB built, with a lookup p50 of 389-393 ns and 5.00-5.13 last-level misses per lookup, and the flat-map (amber), 126.0 MB built, with 113 ns and 0.19-0.20 misses. A dashed box notes that both hub maps exceed the 24 MiB L3."
  caption: "Figure 9.1: The 4,800-parcel line tracker fits L2 and both maps look up in tens of nanoseconds; at 1,000,000 parcels both maps live in RAM, 148.1 MB for the node-map and 126.0 MB for the flat map, and the layout sets the misses."

- name: "09-node-vs-flat-map"
  section: "Ch9 · Eliminating work"
  title: "A node map against a flat map"
  alt: "Two lanes. In the node-map lane an 18-digit barcode goes to a bucket (load 1), a node holding the ParcelState (load 2) and a heap string with the key text (load 3). Results: 2 allocations per insert in C++ (exact) and 128 B/op in Java, a hub lookup p50 of 389-393 ns in C++ and 321-322 ns in Java, and 5.94 last-level read misses per lookup in cachegrind. In the flat-map lane (amber) a packed uint64 barcode goes to one probe group of control bytes and slots, then to columns indexed by the slot. Results: 0 allocations after reserve in C++ (exact) and 0.014-0.016 B/op in Java, a hub lookup p50 of 113 ns in C++ and 57-58 ns in Java, and 0.70 last-level read misses per lookup."
  caption: "Figure 9.2: One probe group and no allocation against three dependent loads and two allocations per insert: the hub lookup p50 falls from 389-393 ns to 113 ns in C++ and from 321-322 ns to 57-58 ns in Java."

- name: "09-hot-cold-split"
  section: "Ch9 · Eliminating work"
  title: "A fat record against hot columns"
  alt: "In the fat-record lane each slot is one 80-byte struct. The sweep reads the due tick and the state, 9 of the 80 bytes, and takes a p50 of 4.18-4.21 ms in C++ and 9.25-9.27 ms in Java over 1,000,000 slots, with 1.2500 cachegrind D1 read misses per slot. In the hot-cold lane (amber) the due_tick column holds 8 B per slot and the state column 1 B per slot; a dashed ghost box holds the cold fields, 71 B per slot, which the sweep never reads. The sweep takes 0.57 ms in C++ and 0.44 ms in Java, with 0.1406 D1 read misses per slot."
  caption: "Figure 9.3: The due sweep reads 9 of every 80 bytes. Splitting them into hot columns takes the sweep p50 from 4.18-4.21 ms to 0.57 ms in C++ and from 9.25-9.27 ms to 0.44 ms in Java."

- name: "09-false-sharing"
  section: "Ch9 · Eliminating work"
  title: "Five camera counters in one cache line"
  alt: "Two lanes of five camera threads on distinct cores. In the adjacent-counters lane (amber arrows) all five write counters 0 to 4, 8 B apart, in one 64-byte cache line. In C++ that costs 0.093-0.094 L1 misses per increment for stores and 0.42-0.44 for read-modify-write, and a batch of 1,000 increments has a p50 of 5,115-5,279 ns for stores and 48.3-57.3 us for read-modify-write. In the pair-padded lane each counter has its own 128-byte range: 0.00016 misses per increment for stores, 0.0002-0.0004 for read-modify-write, and batch p50s of 1,597-1,624 ns and 4.89-5.01 us. A third box records 64-byte padding as an observed middle case, a store batch p50 of 1,653-1,692 ns. In Java the miss count falls 106-167x and the C++ one 590-622x."
  caption: "Figure 9.4: Padding takes the L1 misses per increment from about 0.09 to nearly 0 for stores. The miss count falls 590-622x in C++ and 106-167x in Java; the store batch time moves about 3x, and the read-modify-write batch about 10x."

- name: "10-progress-guarantees"
  section: "Ch10 · Lock-free and wait-free"
  title: "Blocking, lock-free and wait-free claims"
  alt: "Three bands, one per progress guarantee, each with the claim variant, its mechanism and its measurements across four producers claiming 1,000,000 slots each. Blocking: mutex, where a loser parks on a futex; claim p99 of 2,633-2,985 ns in C++ and 8,187-8,383 ns in Java, and 5,406-9,746 (C++) and 47,556-61,712 (Java) voluntary context switches for the least-switching producer. Lock-free: cas-loop, a compare-and-swap retry loop; claim p99 of 478-502 ns in C++ and 1,409-1,837 ns in Java, and a largest retry count in one claim of 7-10 and 27-55. Wait-free claim step (amber): fetch-add, one lock xadd and exactly 1 step per claim; claim p99 of 400-468 ns in C++ and 516-584 ns in Java, and at most 1 (C++) and 1-3 (Java) voluntary switches for the most-switching producer."
  caption: "Figure 10.1: Wait-free bounds the steps of a claim, not the time it takes. At p99 the mutex claim is 6.10-6.45x the fetch-add claim in C++ and 14.13-15.23x in Java, and the CAS loop sits between them."

- name: "10-store-buffer"
  section: "Ch10 · Lock-free and wait-free"
  title: "The store buffer and the induction-gap test"
  alt: "Two induction stations, each with its own store buffer, one gap. Station A stores flagA and loads flagB; station B stores flagB and loads flagA. Each store (amber arrow) goes into the station's store buffer, where flag = 1 is pending, and drains later (dashed) to shared memory, which still holds flagA = 0 and flagB = 0. Each load reads shared memory and sees 0. Under release/acquire both stations read 0 in 2,306,475-9,888,040 of 10,000,000 trials in C++ and in 85.0-98.6 million jcstress samples in Java. Under seq_cst, and Java volatile, both-zero occurs 0 times in 10,000,000 C++ trials and in 0 Java samples."
  caption: "Figure 10.2: Release/acquire lets both stations read the other's flag as 0 while their own store sits in the buffer; seq_cst and volatile forbid it, and the measured count is 0."

- name: "10-seqlock"
  section: "Ch10 · Lock-free and wait-free"
  title: "A sequence lock against a shared mutex"
  alt: "Two lanes. In the seqlock lane (amber) the writer bumps the sequence to odd, writes the fields, a snapshot with a checksum, and bumps the sequence to even; the writer p99 is 25-32 ns in C++ and 206-234 ns in Java with StampedLock, with 0 torn snapshots. Readers read the sequence s1, copy the data, read the sequence s2, and retry (dashed) if s1 is odd or s1 differs from s2. In the shared-mutex lane the writer takes an exclusive lock, which waits for three readers holding the shared lock, writes the fields and unlocks; the writer p99 is 5,979-6,603 ns in C++ and 8,083-8,287 ns in Java with a ReentrantReadWriteLock."
  caption: "Figure 10.3: Readers retry instead of blocking the writer. The writer p99 is 205.5-231.0x lower with a seqlock in C++ and 34.5-37.1x lower with StampedLock in Java, and no reader sees a torn snapshot."

- name: "10-stalled-producer"
  section: "Ch10 · Lock-free and wait-free"
  title: "A claimed but unpublished slot"
  alt: "A fetch-add log of slots, drawn with slot numbers 41 to 44 for illustration. Slot 41 is published and read; a producer claims slot 42 and then sleeps for 1 ms, so it stays claimed but unpublished (amber); slots 43 and 44 are published and waiting. The consumer is stopped at slot 42 and waits 1.05-1.07 ms in C++ and 1.11-1.14 ms in Java."
  caption: "Figure 10.4: A claim by fetch-add is wait-free, but the consumer is not: with one producer asleep for 1 ms between claim and publish, it waits 1.05-1.07 ms in C++ and 1.11-1.14 ms in Java at that slot."

- name: "11-who-holds-the-wait"
  section: "Ch11 · Stackful vs stackless"
  title: "Who holds each of 10,000 waits"
  alt: "Three lanes, each for 10,000 tasks parked on one 1,000 ms timer. OS threads: each wait owns a kernel stack, 16,380-16,384 B in C++, and a reserved user stack, 8,192 KiB in C++; per wait the RSS and address space are 8,774-8,778 B and 9,245,449 B in C++, 19,228-19,247 B and 9,266,672-9,266,776 B in Python, and 22,805-22,898 B and 1,044,486-1,044,591 B in Java. Fibers and virtual threads: a small stack in user space, 65,536 B reserved per C++ fiber and 2,063-2,105 B of heap per Java virtual thread; the RSS and address space per wait are 4,106 B and 69,645 B in C++ and 2,870-3,260 B and 27,262-34,078 B in Java. Coroutines (amber): no stack, only a heap frame, 208 B in C++ and 1,641 B in Python (tracemalloc); the RSS and address space per wait are 1,009 B and 26 B in C++ and 2,611-2,614 B and 2,569 B in Python."
  caption: "Figure 11.1: What a parked wait owns. The resident cost per wait falls from 8,774-8,778 B for a C++ OS thread to 4,106 B for a fiber and 1,009 B for a coroutine, while the reserved address space falls from 9,245,449 B to 69,645 B to 26 B."

- name: "11-switch-path"
  section: "Ch11 · Stackful vs stackless"
  title: "One round trip three ways"
  alt: "Three lanes, one round trip each. OS threads: thread A wakes thread B with a futex wake and the kernel schedules it (amber crossings), with 2.000 voluntary context switches per round trip in C++ and in Java; the round-trip p50 is 3,755-3,777 ns in C++, 4,011-4,029 ns in Python and 4,115-4,175 ns in Java. Fibers and virtual threads: a context swap in user space; the p50 is 205-207 ns for a C++ fiber and 399-404 ns for a Java virtual thread, with 0 voluntary switches in 1,020,000 round trips in C++ and 2-6 in Java. Coroutines: a resume by symmetric transfer; the p50 is 7-18 ns in C++ and 3,785-3,819 ns for a Python asyncio task, with 0 voluntary switches in C++. The thread over fiber ratio is 18.25-18.33x in C++ and the platform thread over virtual thread ratio 10.28-10.48x in Java."
  caption: "Figure 11.2: A resume that never enters the kernel. The C++ round-trip p50 is 3,755-3,777 ns between two OS threads, 205-207 ns between two fibers and 7-18 ns by symmetric transfer; Java goes from 4,115-4,175 ns to 399-404 ns with virtual threads."

- name: "11-blocking-in-a-fiber"
  section: "Ch11 · Stackful vs stackless"
  title: "A blocking call in a fiber and the neighbours"
  alt: "Two lanes. In the C++ lane one carrier thread runs 1,000 fibers; one fiber makes a blocking call, std::this_thread::sleep_for for 2,000 us, 50 times in a run (amber), and the carrier is blocked, so the neighbour fibers wake late. The neighbours' wake lateness p99 is 53 us without the call and 1,918-1,953 us with it. In the ghost lane the Python asyncio twin (gil build, 50 tasks) calls time.sleep for 2 ms in one coroutine and the event loop stalls the same way: the p99 is 1,306-1,309 us without the call and 2,673-2,859 us with it."
  caption: "Figure 11.3: A blocking call stops the carrier, not only the caller. The neighbour fibers' p99 wake lateness goes from 53 us to 1,918-1,953 us, close to the 2 ms sleep itself; the asyncio twin goes from 1,306-1,309 us to 2,673-2,859 us."

- name: "12-readiness-vs-completion"
  section: "Ch12 · I/O engines"
  title: "Readiness against completion"
  alt: "Two panels. Left, readiness: the UDP socket queue (kernel) makes epoll_wait return that the socket is ready, and recvmsg then takes one datagram; each step is a kernel crossing (amber). At saturation in C++, epoll makes 1.379-1.417 system calls per parcel (recvmsg 1, epoll_wait 0.379-0.417) and recvmmsg makes 0.573-0.614. Right, completion: one multishot recvmsg per socket stays armed, the kernel picks a buffer from a provided buffer ring for each datagram and posts a completion queue entry, and the program reaps the queued entries, calling io_uring_enter only to wait. io_uring makes 0.062-0.068 io_uring_enter calls per parcel, with 14.7-16.2 completions per io_uring_enter. The saturation runs are 60 kHz x 4 cameras for 3 s, and the counts depend on load."
  caption: "Figure 12.1: The ring turns a system call per parcel into one call per 14.7-16.2 completions. At saturation, C++ epoll makes 1.379-1.417 system calls per parcel and io_uring 0.062-0.068."

- name: "12-thread-per-core"
  section: "Ch12 · I/O engines"
  title: "Thread-per-core against an acceptor and a pool"
  alt: "Two panels. Left, thread-per-core: four cameras send to four SO_REUSEPORT sockets, each owned by one pinned thread with its own ring, so nothing is shared. Right, acceptor and pool: one receive thread decodes and hands each parcel off through the Ch10 multi-producer log to one of four decide workers. Hand-offs per parcel are 0 and 1, exact. At saturation, 52 kHz x 4 cameras with 3,500 ns of modelled receive work, the C++ p99 is 68-69 us thread-per-core and 84-91 us acceptor and pool, a ratio of 0.77-0.82x that is observed and not asserted; the busiest thread-per-core receiver is 382-384 permille busy and the acceptor 813-831 permille. At line rate, 2.5 kHz per camera, the p99 is 99-116 us thread-per-core and 91-113 us acceptor and pool."
  caption: "Figure 12.2: Shared nothing makes 0 hand-offs per parcel and the acceptor makes 1. At the saturation load the thread-per-core p99, 68-69 us, was 0.77-0.82x the acceptor's, an observed ratio and not a guarantee; at line rate the p99 ranges overlap, 99-116 us against 91-113 us."

- name: "12-vt-vs-event-loop"
  section: "Ch12 · I/O engines"
  title: "Who holds the 2 ms wait in the Quarkus service"
  alt: "Four rows for the Quarkus service with a 2 ms dependency, all Java. Event loop at 5,000 Hz: a non-blocking timer callback holds the wait, 4 event-loop threads and no thread waiting; p99 9.0-10.4 ms. Worker pool at 5,000 Hz: 8 workers, all active, against 10 requests in flight by Little's law (5,000 Hz x 2 ms); a queue builds in front, with the client holding up to 5,661-5,677 requests in flight, and the p99 is 1,453.3-1,455.4 ms. Virtual thread at 5,000 Hz: 4 carrier threads, and the sleeping virtual thread unmounts; p99 6.5-8.9 ms. The defect, blocking-on-event-loop at 1,850 Hz (amber): Thread.sleep(2) on the event loop keeps at most 4 requests in a handler; p99 8.2-8.5 ms against 3.3 ms for the event-loop control at the same rate, a ratio of 2.44-2.61x that is observed."
  caption: "Figure 12.3: Ten requests in flight do not fit in 8 workers: the worker-pool p99 is 1,453.3-1,455.4 ms against 6.5-8.9 ms for virtual threads, 162.85-223.10x. Sleeping on the event loop lifts the p99 to 8.2-8.5 ms at 1,850 Hz, 2.44-2.61x the control."

- name: "13-three-places"
  section: "Ch13 · Where the code runs"
  title: "Three places the same decide path runs"
  alt: "Nested bands: a bare-metal host holds a KVM guest with 4 vCPUs, which holds a Docker container. Lane host: simulators and consumer on the host; emit lateness p99 63-65 us and consumer p99 98 us. Lane vm: native in the guest, which adds VM exits and steal, with steal ticks 0-1 of 8,848-9,886 guest ticks; emit lateness p99 81-84 us and consumer p99 99-102 us. Lane container-host-net: the guest's network namespace and Docker's default seccomp filter, under which io_uring_setup returns EPERM; emit lateness p99 81-89 us and consumer p99 101-105 us. Lane container-bridge: a veth and the bridge in front of the consumer, with the same seccomp filter; emit lateness p99 85-103 us and consumer p99 105-140 us."
  caption: "Figure 13.1: Each lane is measured inside one run, at 10 kHz for 20 s. Emit lateness p99 is 63-65 us in the host lane, 81-84 us in the vm lane and 85-103 us in the container-bridge lane, and the bridge lifts the consumer p99 to 105-140 us against 101-105 us in container-host-net. The host and the guest differ in kernel and clock, so host against vm is not a claim."

- name: "13-quota-vs-cpuset"
  section: "Ch13 · Where the code runs"
  title: "A CPU quota against a cpuset"
  alt: "Two lanes of three 100 ms CFS periods, drawn for illustration. Lane container-cpu-quota (--cpus=2, 200 ms of CPU per 100 ms period): the four busy workers beside the consumer spend the quota early and the cgroup is throttled to the period edge (amber); nr_throttled is 206-207, throttled time 37.8-40.7 s, and the consumer p99.9 is 53,412-55,575 us. Lane container-cpuset (--cpuset-cpus=2,3): two CPUs, no budget and no gaps; nr_throttled is 0, throttled time 0.0 s, and the consumer p99.9 is 2,912-4,067 us. The quota over cpuset p99.9 ratio is 13.16-18.91x."
  caption: "Figure 13.2: Both lanes give the container two CPUs, but only the quota stops the cgroup. The consumer p99.9 is 53,412-55,575 us under --cpus=2 and 2,912-4,067 us under --cpuset-cpus=2,3, a ratio of 13.16-18.91x."

- name: "13-cpu-count-views"
  section: "Ch13 · Where the code runs"
  title: "What each runtime thinks it has"
  alt: "Two panels, one per limit, each with a limit box feeding four answers. Lane container-cpu-quota (--cpus=2): C++ hardware_concurrency() says 4 (amber, it ignores the limit), with an affinity mask of 4, a cgroup-aware pool of 2 and a pool by hardware_concurrency of 4; Python process_cpu_count() says 4 (amber) and os.cpu_count() says 4; Java availableProcessors() says 2, with a virtual-thread scheduler of 2 and 2 GC threads; the Quarkus service has 2 event loops and 8 worker threads. Lane container-cpuset (--cpuset-cpus=2,3): C++ says 4 (amber), with an affinity mask of 2, a cgroup-aware pool of 2 and a pool by hardware_concurrency of 4; Python process_cpu_count() says 2 and os.cpu_count() says 4; Java says 2, with a scheduler of 2 and 2 GC threads; Quarkus has 2 event loops and 8 worker threads. In the vm lane, 4 vCPUs and no limit, C++, Python and Java all say 4."
  caption: "Figure 13.3: A container is a cgroup, not a smaller machine. Under --cpus=2, C++ and Python still say 4 and Java says 2; under --cpuset-cpus=2,3 Python follows the mask and says 2, while C++ hardware_concurrency() still says 4."
