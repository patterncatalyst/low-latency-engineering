- name: "00-sortation-line"
  section: "Ch0 · Setup"
  title: "The sortation line and the scan-to-divert budget"
  alt: "A conveyor carries parcels past a checkweigher, dimensioner, scanner and labeler to a diverter; the controller must sense, decide and act within the scan-to-divert deadline."
  caption: "Figure 0.1 — The sortation line. Belt speed and the scanner-to-diverter distance set the decision deadline."

- name: "00-lab-topology"
  section: "Ch0 · Setup"
  title: "The VM lab: an unprivileged host and a PREEMPT_RT guest"
  alt: "A host band holding lab-ssh.sh, libvirt-ssh-proxy, passt and Docker Engine, with a guest band inside it holding cyclictest, linuxptp, the PREEMPT_RT kernel, Docker and the snapshots lab-ready and lab-ready-rt; an amber ssh-over-AF_VSOCK path runs from the proxy to the guest, and guest traffic leaves through passt."
  caption: "Figure 0.2 — The lab guest is reached by ssh over vsock and networked by passt, so the host needs no NAT, bridge or firewall change. VM numbers are never compared with bare-metal numbers."

- name: "00-measurement-pipeline"
  section: "Ch0 · Setup"
  title: "From the line simulator to a checked report"
  alt: "The C++ line simulator sends UDP datagrams on 127.0.0.1 at 1 kHz to the C++, Python and Java consumers in turn; each records into HdrHistogram and writes a lowlat-report/1 JSON report carrying the machine profile from profile.sh; lowlat-report check validates the schema, decodes the histogram and recomputes the percentiles."
  caption: "Figure 0.3 — Every language records into HdrHistogram and writes the same report format, and the checker recomputes the percentiles instead of trusting them."

- name: "01-batch-vs-per-parcel"
  section: "Ch1 · Latency vs bandwidth"
  title: "Per-parcel handling against batch-32"
  alt: "Two lanes of parcels arriving at 1 kHz: the per-parcel lane handles each parcel on arrival, with p50 106-182 us; the batch lane gathers parcels 1 to 32 into one handling step, and an amber arrow marks the first parcel's ~31 ms wait, with p50 15.2-15.4 ms."
  caption: "Figure 1.1 — Batching leaves throughput unchanged but moves the p50 from 106-182 us to 15.2-15.4 ms, because the first parcel waits for 31 others."

- name: "01-bimodal-tail"
  section: "Ch1 · Latency vs bandwidth"
  title: "One slow parcel in a hundred"
  alt: "Parcels 98 to 104 in a row, with parcel 100 drawn wide as an amber ~2 ms slow path that holds the core and parcel 101 queued behind it; p50 points to a fast-mode box (p50 95-191 us) and p99 to a slow-mode box (p99 2.7-5.6 ms), and a ghost box says one summary number describes neither group."
  caption: "Figure 1.2 — The median stays in the fast mode while p99 lands in the slow mode, among the slow parcel and those queued behind it. One summary number describes neither group."

- name: "02-littles-law"
  section: "Ch2 · Little's Law and Amdahl's Law"
  title: "Little's Law on the line"
  alt: "The line simulator feeds a consumer band at 1000 parcels/s; the band holds a queue of L parcels and a handler with a variable service time; a sampler counts L and a W-bar box labelled model input takes each parcel's residence time; a result box compares sampled L with lambda x W-bar: C++ +0.2 to +0.6 %, Java +0.7 to +2.0 %."
  caption: "Figure 2.1 — The consumer as a queue. Sampled L matches lambda x W-bar within 0.6 % in C++ and 2.0 % in Java; W-bar is a model input, never a reported latency."

- name: "02-amdahl-phases"
  section: "Ch2 · Little's Law and Amdahl's Law"
  title: "Amdahl's Law in phases at N = 1, 2 and 4"
  alt: "Three lanes for N = 1, 2 and 4 workers: parallel scan bars shrink as workers are added, a barrier follows, then an amber serial phase of the same width in every lane and a second barrier; a result box lists predicted and measured speedups at N = 4 for C++, Python threads, Python processes and Java."
  caption: "Figure 2.2 — The serial phase does not shrink with N, so the measured speedup at N = 4 (C++ 2.83-2.85x, Java 2.75-2.76x) stays under the Amdahl prediction of about 3.1x; Python threads under the GIL fall below 1x."

- name: "03-three-clocks"
  section: "Ch3 · Measuring correctly"
  title: "Where each clock starts"
  alt: "A timeline of intended emit, actual send, dequeue and done, with three bars below ending at done: intended-time (amber) starts at the belt's schedule, closed-loop at the send of its own request, receipt-time at dequeue."
  caption: "Figure 3.1 — Three clocks on one parcel. Only intended-time starts at the belt's schedule, so only it is charged for the wait."

- name: "03-coordinated-omission"
  section: "Ch3 · Measuring correctly"
  title: "A 200 ms stall, seen four ways"
  alt: "Two bands: in the UDP run a stalled consumer feeds receipt-time (C++ p99 5.1-5.4 us) and intended-time (p99 100.3-100.5 ms C++, 100.8-101.5 ms Java); in the closed-loop run a client feeds naive (p99 1.0 us C++, 6.9-7.0 us Java) and, through a dashed back-fill edge, corrected (p99 98.2 ms C++, 99.1-99.3 ms Java)."
  caption: "Figure 3.2 — A 200 ms stall is invisible to receipt-time and to the naive closed loop, and visible to the schedule clock and to the back-filled correction. Numbers: bare-metal, untuned host (Intel Core i7-11800H, Fedora 44 kernel 7.2.11-200.fc44, governor `powersave`), runs r02-run1..3."

- name: "04-three-harnesses"
  section: "Ch4 · Benchmark harnesses"
  title: "One workload, three harnesses"
  alt: "A check-digit workload fans out to three lanes: Google Benchmark (C++, DoNotOptimize, 30 repetitions) to median and p99, where p99 is the slowest repetition, pyperf (Python, 6 processes, 3 warm-ups each) to median and p99 of 24 values, and JMH SampleTime (Java, 3 forks, warm-up, Blackhole) to p50, p99 and p99.9."
  caption: "Figure 4.1 — The same check-digit workload in three harnesses. Each repeats and warms up, and each is read as percentiles rather than a single number."

- name: "04-dead-code-elimination"
  section: "Ch4 · Benchmark harnesses"
  title: "Dead-code elimination"
  alt: "C++ and Java lanes each show a guarded variant (DoNotOptimize, Blackhole.consume) with a measured median (4.73 to 4.76 ns in C++, p50 32 ns in Java) and an eliminated variant whose result is unused and removed, timing about 0 ns, at least 473x lower in C++ and at least 3,200x lower in Java; the Python lane is a ghost box: CPython does not eliminate the work, and the contrast there is warm-up."
  caption: "Figure 4.2 — When the result is unused, the compiler or JIT removes the work and the benchmark times nothing."

- name: "05-jit-tiers"
  section: "Ch5 · What the JVM costs"
  title: "JIT tiers and who pays for warm-up"
  alt: "A chain from the interpreter (tier 0) to C1 (tier 1, with tiers 2 and 3 adding profiling) to C2 (tier 4, optimized code), with a dashed deoptimization path from C2 back to the interpreter when an assumption breaks. Below, three line runs at 1 kHz for 20 s compare the first window of 2,000 parcels: --unwarmed binds at once and has a first-window p99.9 of 13.4-28.5 ms; warmed replays 20,000 parcels before the bind (0.29-0.36 ms), and an amber arrow shows the replay driving the code to C2; aot-cache starts from a cache of classes and profiles with no compiled code (0.61-3.2 ms). A note gives the time to ready, a median of 5 launches: 173-177 ms without a trained AOT cache and 51-55 ms with one."
  caption: "Figure 5.1 — The first parcels pay for class loading, interpretation and compilation. Replaying parcels before the bind moves that cost off the belt; the AOT cache (classes and profiles, no compiled code) shortens warm-up but does not remove it."

- name: "05-escape-analysis"
  section: "Ch5 · What the JVM costs"
  title: "Escape analysis removes the allocation"
  alt: "Three JMH lanes run the same decide() call on each parcel. In the escaping lane the DivertDecision is stored in a field, so it stays on the heap and gc.alloc.rate.norm is about 24 B/op. In the scalar-replaced lane (amber) C2 keeps the fields in registers and the counter is below 1 B/op. In the --no-escape-analysis lane, scalar replacement is absent and the counter is about 24 B/op again."
  caption: "Figure 5.2 — An object that never leaves the compiled method costs nothing on the heap: about 24 B/op becomes less than 1 B/op, and turning escape analysis off brings the 24 B back."

- name: "06-collector-pauses"
  section: "Ch6 · GC for tails"
  title: "What each collector stops"
  alt: "A tracker at 10 kHz for 30 s with a 4 GB pre-touched heap feeds four collectors, each with the maximum GC pause read from JFR: stop-the-world Parallel, where all threads stop and the heap is walked, 158-170 ms; G1 with stop-the-world evacuation, 21.0-21.6 ms; Generational ZGC (amber) with concurrent mark and relocate, 0.017-0.036 ms; and generational Shenandoah with concurrent evacuation, 0.53-0.82 ms."
  caption: "Figure 6.1 — Same bytecode and allocation, different collector: the maximum pause runs from 158-170 ms under Parallel to 0.017-0.036 ms under ZGC."

- name: "06-headroom-stall"
  section: "Ch6 · GC for tails"
  title: "Headroom decides whether allocation stalls"
  alt: "Two lanes with the same handler allocating about 400 MB/s of garbage. With a 4 GB heap and a live set well under it, ZGC cycles stay ahead of the rate: 0 allocation stalls and p99.9 of 0.135-0.153 ms. With the heap at 1.05 times the live set, free memory runs out and an amber path leads to an allocation stall where the thread waits; the run records 532-976 stalls with p99.9 of 49.6-134.9 ms."
  caption: "Figure 6.2 — A concurrent collector needs headroom. At 1.05 times the live set, ZGC stalls the allocating thread 532-976 times and p99.9 rises from 0.135-0.153 ms to 49.6-134.9 ms."

- name: "06-refcount-vs-tracing"
  section: "Ch6 · GC for tails"
  title: "Who reclaims memory in C++, Python and Java"
  alt: "Three lanes in the order C++, Python, Java, each with its end-to-end p99.9 latency. C++: the owner frees, so bulk-free destroys a wave on the hot thread (2.08-2.19 ms) while deferred-free hands it to a reclaimer thread (0.135-0.141 ms). Python: refcounts free at once and a generational cycle collector finds cycles; cyclic-garbage runs 9 gen-2 collections (138-144 ms) and frozen, with no cycles and gc.freeze(), runs 0 (0.154-0.168 ms). Java: tracing collectors mark what is live; stop-the-world Parallel is 152-157 ms and ZGC 0.135-0.153 ms."
  caption: "Figure 6.3 — C++ frees where the owner says, CPython frees by reference count and sweeps cycles in generations, and the JVM traces from roots; each has a variant that keeps the reclaim cost off the latency-critical path."

- name: "07-handoff-topology"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "The hand-off between the receive and decide threads"
  alt: "A receive thread passes parcels through a hand-off of 65,536 slots (amber) to the decide thread, which sends divert commands on a separate command channel. A dashed path to an audit journal marks that only the chronicle-journal and write-per-parcel variants append to it. Three hand-off variants can be swapped in (dashed): blocking-queue, an ArrayBlockingQueue that parks, with 199,523-199,540 voluntary context switches over 200,000 parcels; agrona-spsc, whose idle strategy busy-spins, with 29-47; and disruptor with BusySpinWaitStrategy, with 37-41."
  caption: "Figure 7.1 — A spinning idle strategy keeps the decide thread running: 29-47 voluntary context switches for Agrona and 37-41 for the Disruptor, against almost one per parcel for a blocking queue."

- name: "07-ring-sequences"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "Sequences and slots in a ring buffer"
  alt: "A ring of eight slots, drawn as an illustration of the 65,536-slot ring, holds sequences 5 to 10 in slots 5, 6, 7, 0, 1 and 2. The producer, with its cursor on its own cache line, publishes sequence 11 into slot 3 (amber arrow); the consumer reads sequence 5 from slot 5. The slot is the sequence masked with slots minus one, which works because the slot count is a power of two. A dashed ghost box marks a full ring, where the producer would have to wait."
  caption: "Figure 7.2 — A sequence only grows; masking maps it to a slot, and each side writes only its own cursor, so neither takes a lock."

- name: "07-affinity-vm"
  section: "Ch7 · Off-heap and lock-free Java"
  title: "Pinning the decide thread to an isolated vCPU (VM)"
  alt: "Inside the host, the guest lowlat-target boots with isolcpus=3 nohz_full=3 rcu_nocbs=3. stress-ng runs on guest CPUs 0-2, which are vCPU 0-2 free over the host CPUs. An unpinned decide thread shares them and records 174,388-313,298 involuntary context switches across nine alternations and a steady-window hand-off p99.9 of 1.09-1.86 ms (median of 3 alternations per run). A pinned decide thread (AffinityLock 3, amber) runs on the isolated vCPU 3, which libvirt pins to host CPU 13, and records 0-5 involuntary switches and a p99.9 of 51-55 us (same median). All figures are from the VM."
  caption: "Figure 7.3 — Pinned to an isolated vCPU, the decide thread is no longer preempted by the stress load. These are VM figures, never compared with the host runs."

- name: "08-zero-copy-decode"
  section: "Ch8 · Zero-copy and flat data"
  title: "Protobuf parse against a flat view"
  alt: "One receive buffer, a user-space direct ByteBuffer holding one datagram at a time, feeds two decoders. protobuf-decode calls parseFrom and builds a ParcelEvent, a Dimensions and a String barcode: 544-576 B/op with a p50 of 150-160 ns in JMH and 531-591 B per parcel on the line. flat-ffm (amber) puts a reused FlatView on the same bytes, a MemorySegment with VarHandles over the 80-byte parcel-v1 record that checks schema, version and size first: less than 1 B/op, p50 16 ns, and 8.76 B per parcel on the line."
  caption: "Figure 8.1 — A flat 80-byte record read in place allocates under 1 B per decode, against 544-576 B for a protobuf parse."

- name: "08-flat-vs-pointer-layout"
  section: "Ch8 · Zero-copy and flat data"
  title: "An array of objects against a flat table"
  alt: "An object-table of 1,000,000 references points at ParcelState objects scattered on the heap, each with a header and fields, and a sweep of the table takes a p50 of 5.01-5.03 ms. A flat-table keeps 24-byte slots side by side in one MemorySegment in an Arena, and the same sweep takes 0.97-1.00 ms. A dashed ghost box, ParcelState as a value class (JEP 401, JDK 28 early access only), points at the object-table to show the flat layout it aims at on the heap; on common hardware JEP 401 flattens a mutable field or array element only up to 64 bits, null flag included, so a 22-byte ParcelState needs later enhancements. It is not measured, and the book pins JDK 25 LTS."
  caption: "Figure 8.2 — Sweeping one run of memory takes 0.97-1.00 ms, against 5.01-5.03 ms for a pointer per parcel. Value classes aim at that layout but are early access only, so the book measures the flat table."
