[project]
name = "lowlat-amdahl"
version = "1.0.0"
description = "Ch2 Amdahl's Law in Python: threads under the GIL versus processes"
requires-python = ">=3.14"
dependencies = ["lowlat-measure"]

[project.scripts]
amdahl-py = "lowlat_amdahl.cli:main"

[tool.uv.sources]
lowlat-measure = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_amdahl"]
