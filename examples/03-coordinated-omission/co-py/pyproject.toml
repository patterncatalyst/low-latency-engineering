[project]
name = "lowlat-co"
version = "1.0.0"
description = "Ch3: one stall measured three ways (receipt time, intended time, closed-loop corrected) plus a clock-read probe"
requires-python = ">=3.14"
dependencies = ["lowlat-proto", "lowlat-measure", "lowlat-line-consumer"]

[project.scripts]
co-experiment-py = "lowlat_co.cli:main"

[tool.uv.sources]
lowlat-proto = { workspace = true }
lowlat-measure = { workspace = true }
lowlat-line-consumer = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_co"]
