[project]
name = "lowlat-bench-harnesses"
version = "1.0.0"
description = "Ch4: pyperf check-digit benchmark and the converter that turns Google Benchmark, JMH and pyperf output into lowlat reports"
requires-python = ">=3.14"
# pyperf version matches _plans/dependency-pins.md.
dependencies = ["pyperf==2.10.0", "lowlat-measure"]

[project.scripts]
bench-to-report = "lowlat_bench.to_report:main"

[tool.uv.sources]
lowlat-measure = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_bench"]
