[project]
name = "lowlat-gc-tails"
version = "1.0.0"
description = "Ch6: GC pause and tail experiments, Python lane (cyclic garbage vs gc.freeze)"
requires-python = ">=3.14"
dependencies = ["lowlat-proto", "lowlat-measure", "lowlat-line-consumer"]

[project.scripts]
gc-tails-py = "lowlat_gctails.cli:main"

[tool.uv.sources]
lowlat-proto = { workspace = true }
lowlat-measure = { workspace = true }
lowlat-line-consumer = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_gctails"]
