[project]
name = "lowlat-measure"
version = "1.0.0"
description = "Latency measurement kit (HdrHistogram recorder, report writer) and the lowlat-report CLI"
requires-python = ">=3.14"
# Versions match _plans/dependency-pins.md.
dependencies = ["hdrhistogram==0.10.8", "jsonschema==4.26.0"]

[project.scripts]
lowlat-report = "lowlat_measure.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_measure"]
