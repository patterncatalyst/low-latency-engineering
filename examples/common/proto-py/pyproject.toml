[project]
name = "lowlat-proto"
version = "1.0.0"
description = "Python classes generated from contracts/proto with the pinned protoc"
requires-python = ">=3.14"
# protobuf runtime 7.36.2 pairs with protoc 36.2 (see versions.env)
dependencies = ["protobuf==7.36.2"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_proto", "src/lowlat"]
