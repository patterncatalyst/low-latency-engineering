# Ch12 sort-plan service. HTTP/1.1 on loopback is a harness here, not a transport recommendation (Part 6).
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0

# The worker pool is fixed at 8 threads so that lambda x W = 10 in flight (5 kHz x 2 ms) exceeds it. The default is
# max(8 x CPUs, 200) (quarkus.thread-pool.max-threads, unset), which no run here could exceed.
# core-threads (default 1) and prefill (default true) make the pool 8 from the first request.
quarkus.thread-pool.core-threads=8
quarkus.thread-pool.max-threads=8

# The defect variant (blocking-on-event-loop), started with -Dquarkus.profile=defect.
# Vert.x warns about an event-loop task only after quarkus.vertx.max-event-loop-execute-time, which
# defaults to 2 s: a 2 ms block would log nothing. 1 ms is below the block, so every blocked task is
# over the limit. quarkus.vertx.warning-exception-time (default 2 s) is the threshold for the
# exception-stack form of the warning and, in VertxCoreRecorder, the period of the blocked-thread
# checker, so it must be short too: 10 ms checks every event loop 100 times a second.
%defect.quarkus.vertx.max-event-loop-execute-time=1ms
%defect.quarkus.vertx.warning-exception-time=10ms

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."io.vertx.core.impl.BlockedThreadChecker".level=WARN
