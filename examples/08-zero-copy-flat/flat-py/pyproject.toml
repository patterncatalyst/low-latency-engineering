[project]
name = "lowlat-flat"
version = "1.0.0"
description = "Ch8: zero-copy flat-record decode, Python lane (struct.unpack_from vs ParseFromString)"
requires-python = ">=3.14"
dependencies = ["lowlat-proto", "lowlat-measure", "lowlat-line-consumer"]

[project.scripts]
flat-py = "lowlat_flat.cli:main"

[tool.uv.sources]
lowlat-proto = { workspace = true }
lowlat-measure = { workspace = true }
lowlat-line-consumer = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_flat"]
