[project]
name = "lowlat-latdist"
version = "1.0.0"
description = "Ch1 example: per-parcel vs batch-32 vs bimodal consumer"
requires-python = ">=3.14"
dependencies = ["lowlat-proto", "lowlat-measure", "lowlat-line-consumer"]

[project.scripts]
latdist-py = "lowlat_latdist.cli:main"

[tool.uv.sources]
lowlat-proto = { workspace = true }
lowlat-measure = { workspace = true }
lowlat-line-consumer = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowlat_latdist"]
