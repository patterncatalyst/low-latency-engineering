# ────────────────────────────────────────────────────────────────────────────
# Project: low-latency-engineering
# Site identity, GitHub link target, and baseurl. Build configuration below
# generally doesn't need changes.
# ────────────────────────────────────────────────────────────────────────────

title: "Low-Latency Engineering in C++, Python & Java"
description: "Latency engineering from measurement to the real-time kernel — original C++, Python and Java examples on a high-speed parcel sortation line, measured as scan-to-divert."
brand_emoji: "⚡"

github_username: "patterncatalyst"
github_repo: "low-latency-engineering"

# Project Pages site; serve locally with --baseurl ""
baseurl: "/low-latency-engineering"
url: ""

license: "MIT"

# ────────────────────────────────────────────────────────────────────────────
# Build configuration
# ────────────────────────────────────────────────────────────────────────────

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

collections:
  docs:
    output: true
    permalink: /docs/:name/
  plans:
    output: true
    permalink: /plans/:name/
  example_pages:
    output: true
    permalink: /examples/:name/
  parts:
    output: true
    permalink: /parts/:name/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: tutorial
      sectionid: docs
  - scope:
      path: ""
      type: plans
    values:
      layout: plan
  - scope:
      path: ""
      type: example_pages
    values:
      layout: tutorial
      sectionid: examples
  - scope:
      path: ""
      type: parts
    values:
      layout: part_index
      sectionid: docs

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - examples/
  - contracts/
  - diagrams/
  - scripts/
  - manuscript/
  - README.md
  - LICENSE
  - CLAUDE.md
  - PRD.md
  - CONTRIBUTING.md
  - .bundle-cache/
