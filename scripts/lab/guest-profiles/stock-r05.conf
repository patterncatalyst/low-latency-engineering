# stock-r05.conf - the stock-kernel guest profile for the r05 lanes (snapshot lab-ready-r05-stock).
# Sourced by apply-guest-profile.sh; applied inside the guest only, with grubby, to the
# stock Fedora boot entry. Nothing on the host changes.
#
# Same idea as stock-unpinned (r04): the guest as shipped, nothing done to make it quiet. The
# difference is the r05 pins (vCPU 2 and 3 on two host CPUs, libvirt configuration set by
# pin-vcpu.sh, not by this profile) and the extra denied key.
#
#   kernel         the pinned stock Fedora 44 kernel (LAB_STOCK_KERNEL in versions.env), not the
#                  .lowlatrt PREEMPT_RT build. It has to be the default entry before this runs.
#   command line   no isolcpus, no nohz_full, no rcu_nocbs, no irqaffinity
#   tuned          the image default (virtual-guest); this profile never changes it
#
# PROFILE_ARGS is empty on purpose: applying it only strips the denied arguments, so the
# result is the same whether the guest came from lab-ready-rt or has had isolate-cpu23
# applied to the stock entry by hand. Idempotent: a clean entry isn't rewritten.
PROFILE_NAME="stock-r05"
PROFILE_ARGS=""
PROFILE_ENTRY="stock"
PROFILE_DENY_KEYS="isolcpus nohz_full rcu_nocbs irqaffinity"
