# stock-unpinned.conf - the "ordinary VM" guest profile (r04, decision D8).
# Sourced by apply-guest-profile.sh; applied inside the guest only, with grubby, to the
# stock Fedora boot entry. Nothing on the host changes.
#
# This is the baseline Chapter 13 measures against: the guest as a cloud provider would hand
# it over, with nothing done to make it quiet. It is the opposite of isolate-cpu3 (Part 5).
#
#   kernel         the stock Fedora 44 kernel (7.2 series), not the .lowlatrt PREEMPT_RT build
#   vCPUs          4, unpinned: libvirt schedules every vCPU thread on any host CPU
#                  (no <cputune>; scripts/lab/pin-vcpu.sh --remove undoes a pin)
#   command line   no isolcpus, no nohz_full, no rcu_nocbs
#   tuned          whatever the image ships; check-prereqs.sh --vm RECORDS the active tuned
#                  profile (tuned-adm active) and this profile never changes it
#   containers     Docker Engine from Docker's Fedora repository (version recorded by
#                  check-prereqs.sh --vm), default seccomp profile, cgroup v2
#
# PROFILE_ARGS is empty on purpose: the profile adds no kernel arguments. Applying it only
# strips any isolation arguments (PROFILE_DENY_KEYS) from the stock boot entry, so the result
# is the same whether the guest came from lab-ready or from a guest where isolate-cpu3 was
# applied to the stock entry by hand. It is idempotent: an entry that has none of them is not
# rewritten and the guest is not rebooted.
#
# It is the guest's profile for snapshot lab-ready-r04. This is a VM: label every number
# measured under it "vm", and record the guest profile with it.
PROFILE_NAME="stock-unpinned"
PROFILE_ARGS=""
PROFILE_ENTRY="stock"
PROFILE_DENY_KEYS="isolcpus nohz_full rcu_nocbs"
