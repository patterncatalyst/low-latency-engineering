# isolate-cpu3.conf - guest isolation profile for lowlat-target (4 vCPUs).
# Sourced by apply-guest-profile.sh; applied inside the guest only, with grubby, to the
# PREEMPT_RT boot entry. Nothing on the host changes.
#
# Guest CPU 3 is the measurement CPU; guest CPUs 0-2 keep the housekeeping work
# (kernel threads, IRQs by default, ssh, the Docker daemon).
#
#   isolcpus=3     remove CPU 3 from the scheduler's general load balancing, so no
#                  task lands on it unless pinned there (taskset/sched_setaffinity)
#   nohz_full=3    stop the periodic scheduler tick on CPU 3 while exactly one task runs
#                  there (adaptive tickless); needs the CPU to be isolated as well
#   rcu_nocbs=3    run RCU callbacks for CPU 3 on other CPUs' threads (rcuo*)
#
# This is a VM: the isolation is the guest kernel's view. The hypervisor still schedules
# vCPU 3 as a host thread; scripts/lab/pin-vcpu.sh pins it to one host CPU, which is a
# pin, not host isolation. Label every number measured under this profile "vm" and
# record these arguments with it.
PROFILE_NAME="isolate-cpu3"
PROFILE_ARGS="isolcpus=3 nohz_full=3 rcu_nocbs=3"
