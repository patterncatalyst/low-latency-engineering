# isolate-cpu23.conf - guest isolation profile for lowlat-target (4 vCPUs), r05 (decisions D7, D3).
# Sourced by apply-guest-profile.sh; applied inside the guest only, with grubby, to the
# PREEMPT_RT boot entry. Nothing on the host changes.
#
# Guest CPUs 2-3 are the measurement CPUs; guest CPUs 0-1 keep the housekeeping work
# (kernel threads, default IRQs, ssh, the Docker daemon). Compare isolate-cpu3.conf, which
# isolates CPU 3 alone with all three arguments on the entry.
#
#   isolcpus=domain,managed_irq,2-3
#                  domain: take CPUs 2-3 out of the scheduler's load-balancing domains, so no
#                  task lands on them unless it is pinned there (taskset/sched_setaffinity);
#                  two unpinned threads started under `taskset -c 2,3` both stay on CPU 2.
#                  managed_irq: ask the kernel to keep managed interrupts off CPUs 2-3 when
#                  another CPU in the mask is online. A managed IRQ (virtio-blk request queues)
#                  has an affinity the kernel owns and a write to smp_affinity_list fails.
#                  Here each queue's mask is a single CPU, so the flag can't move any of them:
#                  an IRQ stays on the CPU that submits the I/O. The way to keep disk
#                  interrupts off CPUs 2-3 is to submit the I/O from CPUs 0-1.
#   irqaffinity=0-1
#                  default affinity of the IRQs the kernel doesn't manage (virtio-net, ...):
#                  they start on CPUs 0-1 instead of everywhere.
#
# nohz_full=2-3 and rcu_nocbs=2-3 are NOT in this profile. They come from tuned's
# cpu-partitioning profile (`$tuned_params` in its bootloader plugin), driven by
# isolated_cores=2-3 in scripts/lab/tuned/cpu-partitioning-variables.conf and applied by
# scripts/lab/apply-guest-tuned.sh. Keeping one owner per argument avoids two sources that
# can drift. The S1 probe showed the other half of the split: tuned adds no isolcpus, so
# /sys/devices/system/cpu/isolated stays empty and kthreads already on CPUs 2-3 stay there
# until this profile is applied too. Both sets of arguments coexist in the entry. The lane
# named `isolated` is the two together.
#
# This is a VM: the isolation is the guest kernel's view. The hypervisor still schedules
# vCPUs 2-3 as host threads; PIN_MAP=r05 scripts/lab/pin-vcpu.sh pins them to two host CPUs,
# which is a pin, not host isolation. Label every number measured under this profile "vm" and
# record these arguments, the tuned profile and the pins with it.
PROFILE_NAME="isolate-cpu23"
PROFILE_ARGS="isolcpus=domain,managed_irq,2-3 irqaffinity=0-1"
PROFILE_ENTRY="rt"
