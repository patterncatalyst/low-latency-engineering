# cpu-partitioning-variables.conf - input for tuned's cpu-partitioning profile in the lab guest.
# Installed as /etc/tuned/cpu-partitioning-variables.conf by scripts/lab/apply-guest-tuned.sh.
#
# isolated_cores: the guest CPUs tuned treats as isolated. With 2-3, cpu-partitioning puts
# nohz=on nohz_full=2-3 rcu_nocbs=2-3 on the kernel command line, keeps systemd and the
# default IRQ and workqueue masks on CPUs 0-1, and tunes the runtime of CPUs 2-3. It adds no
# isolcpus; guest-profiles/isolate-cpu23.conf supplies that. CPU numbers are guest CPUs
# (vCPUs 2-3, pinned by pin-vcpu.sh).
isolated_cores=2-3
