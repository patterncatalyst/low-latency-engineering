# CI for the measurement kits, the examples and the book's static checks.
#
# Shape (lgtm-github §6): a `changes` job decides whether the heavy build jobs run;
# `validate` is cheap and always runs; one summary job, `ci-ok`, passes when every
# job it needs succeeded or was skipped by `changes`. A ruleset requires `ci-ok`
# only (not applied from here). No `paths:` filter on the triggers: a filtered-out
# run would report nothing and a required check would wait forever.
#
# The build jobs run in a fedora:44 container, the book's platform, with the same
# packages scripts/check-prereqs.sh expects. They only install packages inside the
# container; nothing here tunes a host. Latency numbers are never produced in CI
# (shared runners are not a quiet host); CI proves that everything builds and that
# the unit tests pass. Measurements come from each example's verify.sh on the lab host.
#
# The pinned protobuf (versions.env) is built from source by
# scripts/deps/build-protobuf.sh into ~/.cache/lowlat/prefix and cached on the
# hash of versions.env and that script. Java needs no prefix: the Maven plugin
# resolves protoc from Maven Central at the pinned version.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages check-prereqs.sh looks for, as Fedora 44 names them. No JDK here: the
  # java job installs the pinned Temurin tarball instead (JAVA_PACKAGES + the steps below).
  FEDORA_PACKAGES: >-
    git tar zstd jq which findutils diffutils
    clang gcc-c++ cmake ninja-build zlib-ng-compat-devel
    python3.14 uv
  # Maven comes from Fedora; the JDK it runs on is the pinned Temurin, because Fedora's
  # java-25-openjdk floats (25.0.4 while Temurin is 25.0.5). maven-unbound is the Maven build
  # without a JDK dependency: plain `maven` pulls maven-openjdk25 and its JDK, which Maven could
  # then run on whatever JAVA_HOME says. gzip unpacks the tarball.
  JAVA_PACKAGES: >-
    git tar gzip curl findutils maven maven-unbound

jobs:
  # Decides whether the build jobs run. The workflow always runs, so ci-ok always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! files="$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # cannot diff (new branch, force push): build everything
          elif grep -qE '^(examples/|contracts/|scripts/|diagrams/|versions\.env$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Static checks: front matter, Liquid hygiene, figures against _data/diagrams.yml,
  # codetabs, shell syntax, no mean latency, no tracked *.jfr, build.flags on every Java report,
  # vm-run labels, no EA/prerelease pins, defect-named variants, and the 1,900-2,500 word chapter gate.
  # --self-test plants a bad case for each r02 check in a temporary tree and requires it to fail.
  validate:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packages (container only)
        run: dnf -y --setopt=install_weak_deps=False install git tar zstd python3 python3-pyyaml bash
      - uses: actions/checkout@v7.0.1
      - name: Trust the workspace (git ls-files in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: validate.py
        run: python3 scripts/validate.py
      - name: validate.py --self-test
        run: python3 scripts/validate.py --self-test
      - name: wordcount.sh
        run: scripts/wordcount.sh

  # Builds protoc and the C++ protobuf library once and caches them for cpp and python.
  protobuf:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packages (container only)
        run: dnf -y --setopt=install_weak_deps=False install ${{ env.FEDORA_PACKAGES }}
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        id: prefix
        with:
          path: ~/.cache/lowlat/prefix
          key: lowlat-prefix-fedora44-${{ hashFiles('versions.env', 'scripts/deps/build-protobuf.sh') }}
      - name: Build the pinned protobuf and abseil
        if: steps.prefix.outputs.cache-hit != 'true'
        run: scripts/deps/build-protobuf.sh
      - name: Check the pinned protoc
        run: ~/.cache/lowlat/prefix/bin/protoc --version

  # C++: the kits, the line simulator, the consumers and every chapter's C++ example.
  cpp:
    needs: [changes, protobuf]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packages (container only)
        run: dnf -y --setopt=install_weak_deps=False install ${{ env.FEDORA_PACKAGES }}
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/lowlat/prefix
          key: lowlat-prefix-fedora44-${{ hashFiles('versions.env', 'scripts/deps/build-protobuf.sh') }}
      - name: Ensure the pinned protobuf (no-op on a cache hit)
        run: scripts/deps/build-protobuf.sh
      - name: Configure, build, test (release preset)
        working-directory: examples
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release

  # Python: the uv workspace, the generated protobuf modules, pytest and ruff.
  python:
    needs: [changes, protobuf]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      UV_PYTHON: python3.14
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install packages (container only)
        run: dnf -y --setopt=install_weak_deps=False install ${{ env.FEDORA_PACKAGES }}
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/lowlat/prefix
          key: lowlat-prefix-fedora44-${{ hashFiles('versions.env', 'scripts/deps/build-protobuf.sh') }}
      - name: Ensure the pinned protobuf (no-op on a cache hit)
        run: scripts/deps/build-protobuf.sh
      - name: Generate the Python protobuf modules
        run: scripts/gen-python-proto.sh
      - name: Sync, test, lint
        working-directory: examples
        run: |
          uv sync --all-packages
          uv run pytest
          uv run ruff check . ../scripts ../diagrams
          uv run ruff format --check . ../scripts ../diagrams

  # Java: the aggregator builds every module (kits, simulator consumer, chapters 1-10) and runs the tests,
  # including the 05 AOT-cache smoke test (a child JVM trains a cache, then runs with -XX:AOTMode=on).
  # The JDK is the Temurin tarball pinned in versions.env (TEMURIN_URL, SHA-checked), the same
  # build the lab guest runs; the tarball is cached on its SHA and re-verified on every run.
  java:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packages (container only)
        run: dnf -y --setopt=install_weak_deps=False install ${{ env.JAVA_PACKAGES }}
      - uses: actions/checkout@v7.0.1
      - name: Read the Temurin pin
        id: temurin
        run: |
          . ./versions.env
          echo "sha256=$TEMURIN_SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$TEMURIN_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: jdk
        with:
          path: ~/.cache/lowlat/temurin.tar.gz
          key: lowlat-temurin-${{ steps.temurin.outputs.sha256 }}
      - name: Fetch Temurin (skipped on a cache hit), verify the SHA, install
        run: |
          . ./versions.env
          tarball="$HOME/.cache/lowlat/temurin.tar.gz"
          mkdir -p "$(dirname "$tarball")"
          [ -f "$tarball" ] || curl -fL --retry 3 -o "$tarball" "$TEMURIN_URL"
          [ "$(sha256sum "$tarball" | cut -d' ' -f1)" = "$TEMURIN_SHA256" ] || { echo "Temurin SHA256 mismatch" >&2; rm -f "$tarball"; exit 1; }
          jdk="$HOME/.cache/lowlat/temurin-$TEMURIN_VERSION"
          mkdir -p "$jdk"
          tar -xzf "$tarball" -C "$jdk" --strip-components=1
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: lowlat-m2-fedora44-${{ hashFiles('examples/pom.xml', 'examples/**/pom.xml') }}
          restore-keys: lowlat-m2-fedora44-
      - name: Show the toolchain
        run: |
          java -version
          mvn -v
          [ "$(java -version 2>&1 | head -1 | cut -d'"' -f2)" = "${{ steps.temurin.outputs.version }}" ]
          # Maven itself must run on the pinned Temurin, not on a JDK that came in with a package.
          mvn -v | grep -qF "Java version: ${{ steps.temurin.outputs.version }}," || { echo "Maven is not running on Temurin ${{ steps.temurin.outputs.version }}" >&2; exit 1; }
          mvn -v | grep -qF "runtime: $JAVA_HOME" || { echo "Maven's runtime is not JAVA_HOME ($JAVA_HOME)" >&2; exit 1; }
      - name: Build and test every module
        run: mvn -B -f examples/pom.xml verify

  # The one check a ruleset requires. Passes when every needed job succeeded or
  # was skipped by `changes`.
  ci-ok:
    if: always()
    needs: [changes, validate, protobuf, cpp, python, java]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
